<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Kolam Lele Kontrol Center</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f1f5f9; padding: 15px; margin: 0; }
        .main-title { text-align: center; color: #1e293b; margin-bottom: 5px; font-size: 24px; }
        .main-subtitle { text-align: center; color: #64748b; font-size: 14px; margin-bottom: 25px; }
        .kolam-container { max-width: 500px; margin: 0 auto 25px auto; background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-top: 6px solid #2980b9; }
        .kolam-title { font-size: 18px; color: #1e293b; font-weight: bold; margin-bottom: 15px; display: flex; justify-content: space-between; }
        .grid-sensor { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .sensor-card { background: #f8fafc; padding: 12px; border-radius: 8px; border: 1px solid #e2e8f0; }
        .sensor-card h4 { margin: 0; font-size: 11px; color: #64748b; text-transform: uppercase; }
        .sensor-card .value { font-size: 18px; font-weight: bold; color: #0f172a; margin-top: 4px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        label { font-size: 12px; font-weight: bold; color: #475569; display: block; margin-bottom: 4px; }
        input, select { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        .btn { width: 100%; padding: 10px; color: white; border: none; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 5px; font-size: 14px; }
        .btn-save { background-color: #2980b9; }
        .btn-feed { background-color: #27ae60; margin-top: 10px; }
        .status-text { text-align: center; font-size: 12px; color: #64748b; margin-top: 5px; font-style: italic; }
    </style>
</head>
<body>

    <h1 class="main-title">Smart Aquaculture System</h1>
    <div class="main-subtitle">Sistem Manajemen Terintegrasi 3 Kolam Diameter 2m</div>

    <div class="kolam-container" style="border-top-color: #2980b9;">
        <div class="kolam-title"><span>🐟 KOLAM BUNDAR 1</span> <span style="font-size:12px; color:#2980b9;" id="statusK1">Standby</span></div>
        <div class="grid-sensor">
            <div class="sensor-card"><h4>pH Air</h4><div class="value" id="phK1">--</div></div>
            <div class="sensor-card"><h4>Suhu Air</h4><div class="value" id="suhuK1">-- °C</div></div>
        </div>
        <div class="form-row">
            <div><label>Jam Makan Pagi:</label><input type="number" id="pagiK1" min="0" max="23" value="7"></div>
            <div><label>Jam Makan Sore:</label><input type="number" id="soreK1" min="0" max="23" value="16"></div>
        </div>
        <div style="margin-bottom: 12px;"><label>Porsi / Takaran Pakan:</label>
            <select id="takaranK1">
                <option value="1500">Sedikit (1.5 Detik)</option>
                <option value="2500" selected>Sedang (2.5 Detik)</option>
                <option value="4000">Banyak (4 Detik)</option>
            </select>
        </div>
        <button class="btn btn-save" onclick="simpanPengaturan(1)">SIMPAN JADWAL KOLAM 1</button>
        <button class="btn btn-feed" onclick="pakanManual(1)">BERI PAKAN MANUAL K1</button>
    </div>

    <div class="kolam-container" style="border-top-color: #e67e22;">
        <div class="kolam-title"><span>🐟 KOLAM BUNDAR 2</span> <span style="font-size:12px; color:#e67e22;" id="statusK2">Standby</span></div>
        <div class="grid-sensor">
            <div class="sensor-card"><h4>pH Air</h4><div class="value" id="phK2">--</div></div>
            <div class="sensor-card"><h4>Suhu Air</h4><div class="value" id="suhuK2">-- °C</div></div>
        </div>
        <div class="form-row">
            <div><label>Jam Makan Pagi:</label><input type="number" id="pagiK2" min="0" max="23" value="7"></div>
            <div><label>Jam Makan Sore:</label><input type="number" id="soreK2" min="0" max="23" value="16"></div>
        </div>
        <div style="margin-bottom: 12px;"><label>Porsi / Takaran Pakan:</label>
            <select id="takaranK2">
                <option value="1500">Sedikit (1.5 Detik)</option>
                <option value="2500" selected>Sedang (2.5 Detik)</option>
                <option value="4000">Banyak (4 Detik)</option>
            </select>
        </div>
        <button class="btn btn-save" style="background-color:#e67e22;" onclick="simpanPengaturan(2)">SIMPAN JADWAL KOLAM 2</button>
        <button class="btn btn-feed" onclick="pakanManual(2)">BERI PAKAN MANUAL K2</button>
    </div>

    <div class="kolam-container" style="border-top-color: #9b59b6;">
        <div class="kolam-title"><span>🐟 KOLAM BUNDAR 3</span> <span style="font-size:12px; color:#9b59b6;" id="statusK3">Standby</span></div>
        <div class="grid-sensor">
            <div class="sensor-card"><h4>pH Air</h4><div class="value" id="phK3">--</div></div>
            <div class="sensor-card"><h4>Suhu Air</h4><div class="value" id="suhuK3">-- °C</div></div>
        </div>
        <div class="form-row">
            <div><label>Jam Makan Pagi:</label><input type="number" id="pagiK3" min="0" max="23" value="7"></div>
            <div><label>Jam Makan Sore:</label><input type="number" id="soreK3" min="0" max="23" value="16"></div>
        </div>
        <div style="margin-bottom: 12px;"><label>Porsi / Takaran Pakan:</label>
            <select id="takaranK3">
                <option value="1500">Sedikit (1.5 Detik)</option>
                <option value="2500" selected>Sedang (2.5 Detik)</option>
                <option value="4000">Banyak (4 Detik)</option>
            </select>
        </div>
        <button class="btn btn-save" style="background-color:#9b59b6;" onclick="simpanPengaturan(3)">SIMPAN JADWAL KOLAM 3</button>
        <button class="btn btn-feed" onclick="pakanManual(3)">BERI PAKAN MANUAL K3</button>
    </div>

    <script>
        // MASUKKAN DATA CONFIG CONFIG CLOUD ANDA BERDASARKAN INDEKS [K1, K2, K3]
        const channelIDs = ["3403754", "3404575", "3404577"];
        const writeKeys  = ["60PHWAI5OBQ2BKE9", "A51C5Z5NH29JJ9F3", "3J7EMC6XU2V55N58"];
        const readKeys   = ["RE5P2KRTKYKXYSOR", "DC61K158BZQATD8W", "T35LJFZV13N7VTT8"];

        function muatDataRealtime() {
            for(let i = 0; i < 3; i++) {
                let kNum = i + 1;
                fetch(`https://api.thingspeak.com/channels/${channelIDs[i]}/feeds/last.json?api_key=${readKeys[i]}`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById(`phK${kNum}`).innerText = data.field5 ? parseFloat(data.field5).toFixed(1) : "--";
                    document.getElementById(`suhuK${kNum}`).innerText = data.field6 ? parseFloat(data.field6).toFixed(1) : "--";
                }).catch(err => console.log("Gagal memuat data Kolam " + kNum));
            }
        }

        setInterval(muatDataRealtime, 15000);
        muatDataRealtime();

        function simpanPengaturan(kolamNum) {
            let idx = kolamNum - 1;
            let pagi = document.getElementById(`pagiK${kolamNum}`).value;
            let sore = document.getElementById(`soreK${kolamNum}`).value;
            let takaran = document.getElementById(`takaranK${kolamNum}`).value;
            
            document.getElementById(`statusK${kolamNum}`).innerText = "Menyimpan...";
            
            // Kirim Update Jadwal Pagi (Field3), Sore (Field4), dan Takaran (Field7)
            fetch(`https://api.thingspeak.com/update?api_key=${writeKeys[idx]}&field3=${pagi}&field4=${sore}&field7=${takaran}`)
            .then(res => {
                if(res.ok) document.getElementById(`statusK${kolamNum}`).innerText = "Jadwal Disimpan!";
            });
        }

        function pakanManual(kolamNum) {
            let idx = kolamNum - 1;
            document.getElementById(`statusK${kolamNum}`).innerText = "Sinyal pakan dikirim...";
            fetch(`https://api.thingspeak.com/update?api_key=${writeKeys[idx]}&field1=1`)
            .then(res => {
                if(res.ok) document.getElementById(`statusK${kolamNum}`).innerText = "Berhasil Disuap!";
            });
        }
    </script>
</body>
</html>
