<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontrol Pakan Lele Jarak Jauh</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; margin-top: 50px; background-color: #f0f4f8; color: #333; }
        .container { max-width: 400px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; font-size: 24px; }
        .btn { background-color: #27ae60; color: white; border: none; padding: 20px 40px; font-size: 20px; font-weight: bold; cursor: pointer; border-radius: 50px; width: 100%; transition: 0.2s; box-shadow: 0 5px #1e7e43; }
        .btn:active { box-shadow: 0 2px #1e7e43; transform: translateY(3px); }
        #status { margin-top: 20px; font-weight: bold; color: #7f8c8d; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Pakan Lele Otomatis</h1>
        <p>Tekan tombol di bawah untuk memberi makan ikan dari mana saja.</p>
        <br>
        <button class="btn" onclick="beriPakan()">KIRIM PAKAN</button>
        <div id="status">Status: Standby</div>
    </div>

    <script>
        function beriPakan() {
            document.getElementById("status").innerHTML = "Mengirim perintah...";
            
            // GANTI DENGAN WRITE API KEY DARI THINGSPEAK ANDA
            const apiKey = "60PHWAI5OBQ2BKE9"; 
            const url = `https://api.thingspeak.com/update?api_key=${apiKey}&field1=1`;

            fetch(url)
            .then(response => {
                if(response.ok) {
                    document.getElementById("status").innerHTML = "Sinyal Terkirim! Menunggu ESP32...";
                    setTimeout(() => { document.getElementById("status").innerHTML = "Standby"; }, 5000);
                } else {
                    document.getElementById("status").innerHTML = "Gagal mengirim sinyal.";
                }
            })
            .catch(err => {
                document.getElementById("status").innerHTML = "Error koneksi internet.";
            });
        }
    </script>
</body>
</html>
